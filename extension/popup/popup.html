<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>localCAI</h1>
  <p class="sub">Bring your characters home</p>

  <div id="not-cai" class="note" hidden>Open a chat on character.ai first, then refresh the page.</div>

  <div id="main" hidden>
    <dl class="stats">
      <div><dt>Characters</dt><dd id="s-characters">0</dd></div>
      <div><dt>Chats</dt><dd id="s-chats">0</dd></div>
      <div><dt>Messages</dt><dd id="s-turns">0</dd></div>
      <div><dt>Pinned</dt><dd id="s-pinned">0</dd></div>
    </dl>
    <p class="hint">Only chats you open in this tab are captured. Scroll up to load older messages.</p>
    <button id="export" class="primary">Export .lcai.json</button>
    <button id="raw">Debug: raw data (secrets redacted)</button>
    <button id="clear" class="ghost">Clear</button>
  </div>

  <p class="foot">Not affiliated with Character.AI · Your data only</p>
  <script src="popup.js"></script>
</body>
</html>
