name: Delete releases (maintenance)

# Manually run: deletes the given releases and their tags (e.g. after rewriting history).
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tags to delete, e.g. v0.8.0 v0.8.1"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          for t in $TAGS; do
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || \
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
            echo "deleted $t"
          done
