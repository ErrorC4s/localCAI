name: Build & release

# Every push to main that touches the app or the extension builds localCAI.exe and the
# extension zips, and publishes them as the GitHub Release for the current version
# (localcai/__init__.py → v<version>). Same version again = the release's files are updated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "localcai/**"
      - "assets/**"
      - "packaging/**"
      - "tools/package_extension.py"
      - "tests/**"
      - "store/release-notes.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # End-to-end tests (app UI in a real browser, built-in engine with a stand-in llama-server, and the
  # browser extension against a mock character.ai). No release unless these pass.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
          npm install --no-save playwright
          npx playwright install chromium
      - name: Unit tests
        run: python -m pytest -q tests/test_pipeline.py
      - name: App UI end-to-end
        run: python tests/e2e_ui/test_ui.py
      - name: Built-in engine end-to-end
        run: python tests/e2e_ui/test_engine.py
      - name: Clean pip install includes the extension
        run: |
          python -m venv /tmp/pipcheck
          /tmp/pipcheck/bin/pip install -q .
          cp tests/pip_install_check.py /tmp/ && cd /tmp && /tmp/pipcheck/bin/python pip_install_check.py
      - name: Extension end-to-end
        run: |
          node tests/e2e_extension/e2e.mjs /tmp/e2e.lcai.json
          node tests/e2e_extension/load_all.mjs

  windows:
    needs: e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version
        shell: bash
        run: echo "VERSION=$(python -c 'import localcai;print(localcai.__version__)')" >> "$GITHUB_ENV"
      - name: Run the tests (no release if they fail)
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_pipeline.py
      - name: Build localCAI.exe
        shell: cmd
        run: |
          python -m pip install --upgrade pyinstaller pywebview
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name localCAI ^
            --icon assets\logo.ico ^
            --add-data "assets\logo.ico;assets" ^
            --add-data "localcai\webui\static;localcai\webui\static" ^
            --add-data "localcai\extension;localcai\extension" ^
            --collect-all webview ^
            packaging\exe_entry.py
      - name: Smoke test the exe's bundle
        shell: bash
        run: test -s dist/localCAI.exe && ls -la dist/localCAI.exe
      - name: Run the built exe (start, prepare extension, import, export card + chat, quit)
        shell: bash
        run: python tests/exe_smoke.py dist/localCAI.exe
      - name: Package extension
        run: python tools/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: localCAI-${{ env.VERSION }}-windows
          path: |
            dist/localCAI.exe
            dist/localcai-extractor-*.zip
      - name: Publish release v${{ env.VERSION }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: localCAI v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: store/release-notes.md
          prerelease: true
          files: |
            dist/localCAI.exe
            dist/localcai-extractor-*.zip
