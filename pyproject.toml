[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localcai"
version = "0.3.0"
description = "Bring your Character.AI characters and chats home and run them on a local model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # stdlib only, on purpose: easy to install for non-developers

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
localcai = "localcai.cli:main"

[tool.setuptools.packages.find]
include = ["localcai*"]

[tool.setuptools.package-data]
localcai = ["webui/static/*"]
